version: '3.8'

services:
  pigment-ai:
    build: .
    container_name: pigment-ai-server
    ports:
      - "5000:8080"
    volumes:
      - ./training_data:/app/training_data
      - ./models:/app/models
      - ./data:/app/data
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Add a backup service
  backup:
    image: alpine
    container_name: pigment-backup
    volumes:
      - ./training_data:/data:ro
      - ./backups:/backup
    command: |
      sh -c "
      while true; do
        tar -czf /backup/training_$$(date +%Y%m%d_%H%M%S).tar.gz /data/ 2>/dev/null || true;
        echo 'Backup completed at $$(date)';
        sleep 86400;  # Backup every 24 hours
      done
      "
    restart: unless-stopped
